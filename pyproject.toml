[project]
name = "janus-llm"
version = "5.0.0"
description = "A transcoding library using LLMs."
authors = [
    { name = "Michael Doyle", email = "mdoyle@mitre.org" },
    { name = "Chris Glasz",   email = "cglasz@mitre.org" },
    { name = "Chris Tohline", email = "ctohline@mitre.org" },
    { name = "William Macke", email = "wmacke@mitre.org" },
    { name = "Paul Kirk",     email = "pkirk@mitre.org" },
    { name = "Lily Wong",     email = "lwong@mitre.org" },
    { name = "Michael Threet",email = "mthreet@mitre.org" },
    { name = "Colin Diggs",   email = "cdiggs@mitre.org" },
    { name = "Pranay Jain",   email = "pranayjain@mitre.org" },
    { name = "Chris Kempis",  email = "ckempis@mitre.org" },
]
license = "Apache 2.0"
readme = "README.md"
requires-python = ">=3.11,<3.13"
keywords = [
    "llm",
    "transcoding",
    "decompilation",
    "reverse-engineering",
    "machine-learning",
    "natural-language-processing",
    "modernization",
]
dependencies = [
    "aenum>=3.1.15",
    "gpt4all>=2.0.2",
    "gitpython>=3.1.32",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "numpy>=1.24.3",
    "openai>=1.14.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.1",
    "sacrebleu>=2.4.1",
    "text-generation>=0.6.0",
    "tiktoken>=0.7.0",
    "transformers>=4.31.0",
    "tree-sitter>=0.24.0",
    "typer>=0.9.0",
    "unstructured>=0.15.9",
    "unstructured-inference>=0.7.36",
    "pytesseract>=0.3.13",
    "tesseract>=0.1.3",
    "unstructured-pytesseract>=0.3.13",
    "langchain-unstructured>=0.1.2",
    "scikit-learn>=1.5.2",
    "pi-heif>=0.20.0",
    "pybind11>=2.13.6",
    "chromadb>=0.5.21",
    "setuptools>=75.6.0",
    "textstat>=0.7.5",
    "rouge-score>=0.1.2",
]


[project.urls]
repository = "https://github.com/janus-llm/janus-llm"
documentation = "https://janus-llm.github.io/janus-llm"

[tool.poetry]
packages = [
    { include = "janus" }
]

[project.scripts]
janus = "janus.cli.cli:app"

[tool.poetry.group.dev.dependencies]
black = "^23.3.0"
flake8 = "^6.0.0"
isort = "^5.12.0"
pre-commit = "^3.3.1"
pydocstyle = "^6.3.0"
bandit = "^1.7.5"
pytest = "^7.3.1"

[tool.poetry.group.docs.dependencies]
Sphinx = "^6.0.2"
sphinx-autoapi = "^3.0.0"
sphinx-rtd-theme = "^1.0.0"
myst-parser = "^1.0.0"
furo = "^2023.3.27"
sphinx-autobuild = "^2021.3.14"
sphinx-copybutton = "^0.5.2"
sphinxext-opengraph = "^0.9.1"

[tool.poetry.group.coverage.dependencies]
pytest-cov = "^4.1.0"

[project.optional-dependencies]
bedrock = ["langchain-aws>=0.2.22", "boto3>=1.34.142"]
hf-local = ["sentence-transformers>=2.6.1"]

[tool.black]
line-length = 90
target-version = ['py310']
exclude = "decompile_script.py"

[tool.pydocstyle]
convention = "google"
# match '*.py' files that don't start with 'test_' or '__init'
match = '(?![test_|__init]).*\.py'

[tool.bandit]
# We aren't using pseudo-random numbers for cryptographic purposes
skips = ["B311", "B404"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (select with '-m slow')",
    "translate: marks tests as translation tests (select with '-m translate')",
    "ghidra: marks tests as tests that use a Ghidra executable (select with '-m ghidra')",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
